<title id="t">EH3D-NODE-BUNGARD-HMI architecture</title>
<desc id="d">EH3D-NODE-BUNGARD-HMI is firmware in C++17 for the ESP32-P4 module with a 10.1-inch touch display, written for ESP-IDF 5.5 and LVGL 9. Every move and spindle order, from a touch or from the voice, passes the gate: a confirmation on the screen, the hardware-stop latch and the armed link. The rules, the settings file, the spoken orders and the texts in eight languages are tested on a computer; the firmware has not been built or run on a module.</desc>
